version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: inference_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql

  inference:
    build: ./inference
    ports:
      - "8001:8001"

  api:
    build: ./api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - inference
      - kafka
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/inference_db
      INFERENCE_URL: http://inference:8001
      KAFKA_BROKERS: kafka:9092
    volumes:
      - uploads_data:/app/uploads


  zookeeper:
     image: confluentinc/cp-zookeeper:7.6.0
     environment:
       ZOOKEEPER_CLIENT_PORT: 2181
  
  kafka:
     image: confluentinc/cp-kafka:7.6.0
     depends_on: [zookeeper]
     ports:
       - "9092:9092"
     environment:
       KAFKA_BROKER_ID: 1
       KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
       KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
       KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  
  worker:
     build: ./worker
     depends_on: [kafka, postgres, inference]
     environment:
      DATABASE_URL: postgres://app:app@postgres:5432/inference_db
      INFERENCE_URL: http://inference:8001
      KAFKA_BROKERS: kafka:9092
     volumes:
       - uploads_data:/app/uploads

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  
  websocket:
     build: ./websocket
     ports:
       - "8082:8082"
     depends_on: 
      - redis
     environment:
      REDIS_ADDR: redis:6379

volumes:
  pgdata:
  uploads_data:
